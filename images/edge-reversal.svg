<svg xmlns="http://www.w3.org/2000/svg" width="540" height="222" viewBox="0 0 540 222" role="img" aria-labelledby="title desc">
  <title id="title">Reversing a weight-two edge</title>
  <desc id="desc">In the two orientations, this edge contributes two units to V alone or to U alone.</desc>
  <rect x="0" y="0" width="540" height="222" rx="0" fill="#faf8f4" stroke="none" stroke-width="1.5" />
  <circle cx="114" cy="56" r="23" fill="white" stroke="#252320" stroke-width="2" />
  <text x="114" y="63" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#252320" font-weight="650">U</text>
  <circle cx="425" cy="56" r="23" fill="white" stroke="#252320" stroke-width="2" />
  <text x="425" y="63" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#252320" font-weight="650">V</text>
  <line x1="141" y1="56" x2="388.0" y2="56.0" stroke="#245675" stroke-width="4" />
  <polygon points="395,56 385.00,51.00 385.00,61.00" fill="#245675" />
  <text x="270" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#245675" font-weight="400">Weight 2</text>
  <text x="114" y="103" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#252320" font-weight="400">+0</text>
  <text x="425" y="103" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#252320" font-weight="400">+2</text>
  <circle cx="114" cy="160" r="23" fill="white" stroke="#252320" stroke-width="2" />
  <text x="114" y="167" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#252320" font-weight="650">U</text>
  <circle cx="425" cy="160" r="23" fill="white" stroke="#252320" stroke-width="2" />
  <text x="425" y="167" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#252320" font-weight="650">V</text>
  <line x1="398" y1="160" x2="151.0" y2="160.0" stroke="#245675" stroke-width="4" />
  <polygon points="144,160 154.00,165.00 154.00,155.00" fill="#245675" />
  <text x="270" y="148" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#245675" font-weight="400">Weight 2</text>
  <text x="114" y="207" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#252320" font-weight="400">+2</text>
  <text x="425" y="207" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#252320" font-weight="400">+0</text>
  <line x1="28" y1="113" x2="512" y2="113" stroke="#d6cfc6" stroke-width="1" />
</svg>
