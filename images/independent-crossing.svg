<svg xmlns="http://www.w3.org/2000/svg" width="540" height="244" viewBox="0 0 540 244" role="img" aria-labelledby="title desc">
  <title id="title">Independent directions at a crossover</title>
  <desc id="desc">The four combinations are right/up, left/up, right/down, and left/down. Changing the direction of either path preserves the direction of the other.</desc>
  <rect x="0" y="0" width="540" height="244" rx="0" fill="#faf8f4" stroke="none" stroke-width="1.5" />
  <line x1="70" y1="98" x2="70.0" y2="33.0" stroke="#923d39" stroke-width="3" />
  <polygon points="70,26 65.00,36.00 75.00,36.00" fill="#923d39" />
  <line x1="61" y1="62" x2="79" y2="62" stroke="#faf8f4" stroke-width="10" />
  <line x1="32" y1="62" x2="101.0" y2="62.0" stroke="#245675" stroke-width="3" />
  <polygon points="108,62 98.00,57.00 98.00,67.00" fill="#245675" />
  <text x="128" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#245675" font-weight="600">Right</text>
  <text x="128" y="83" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#923d39" font-weight="600">Up</text>
  <line x1="332" y1="98" x2="332.0" y2="33.0" stroke="#923d39" stroke-width="3" />
  <polygon points="332,26 327.00,36.00 337.00,36.00" fill="#923d39" />
  <line x1="323" y1="62" x2="341" y2="62" stroke="#faf8f4" stroke-width="10" />
  <line x1="370" y1="62" x2="301.0" y2="62.0" stroke="#245675" stroke-width="3" />
  <polygon points="294,62 304.00,67.00 304.00,57.00" fill="#245675" />
  <text x="390" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#245675" font-weight="600">Left</text>
  <text x="390" y="83" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#923d39" font-weight="600">Up</text>
  <line x1="70" y1="145" x2="70.0" y2="210.0" stroke="#923d39" stroke-width="3" />
  <polygon points="70,217 75.00,207.00 65.00,207.00" fill="#923d39" />
  <line x1="61" y1="181" x2="79" y2="181" stroke="#faf8f4" stroke-width="10" />
  <line x1="32" y1="181" x2="101.0" y2="181.0" stroke="#245675" stroke-width="3" />
  <polygon points="108,181 98.00,176.00 98.00,186.00" fill="#245675" />
  <text x="128" y="177" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#245675" font-weight="600">Right</text>
  <text x="128" y="202" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#923d39" font-weight="600">Down</text>
  <line x1="332" y1="145" x2="332.0" y2="210.0" stroke="#923d39" stroke-width="3" />
  <polygon points="332,217 337.00,207.00 327.00,207.00" fill="#923d39" />
  <line x1="323" y1="181" x2="341" y2="181" stroke="#faf8f4" stroke-width="10" />
  <line x1="370" y1="181" x2="301.0" y2="181.0" stroke="#245675" stroke-width="3" />
  <polygon points="294,181 304.00,186.00 304.00,176.00" fill="#245675" />
  <text x="390" y="177" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#245675" font-weight="600">Left</text>
  <text x="390" y="202" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#923d39" font-weight="600">Down</text>
  <line x1="270" y1="18" x2="270" y2="226" stroke="#d6cfc6" stroke-width="1" />
  <line x1="18" y1="122" x2="522" y2="122" stroke="#d6cfc6" stroke-width="1" />
