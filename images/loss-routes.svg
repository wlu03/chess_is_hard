<svg xmlns="http://www.w3.org/2000/svg" width="540" height="248" viewBox="0 0 540 248" role="img" aria-labelledby="title desc">
  <title id="title">A loss in G₃ becomes a mating attack</title>
  <desc id="desc">If White makes W-LOSE true, Black attacks the white king. If Black makes B-LOSE true, White attacks the black king.</desc>
  <rect x="0" y="0" width="540" height="248" rx="0" fill="#faf8f4" stroke="none" stroke-width="1.5" />
  <rect x="18" y="20" width="244" height="89" rx="8" fill="white" stroke="#d6cfc6" stroke-width="1.5" />
  <text x="140" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#252320" font-weight="650">White flips a bit</text>
  <text x="140" y="83" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#57534e" font-weight="400">W-LOSE is true</text>
  <line x1="269" y1="65" x2="309.0" y2="65.0" stroke="#923d39" stroke-width="3" />
  <polygon points="316,65 306.00,60.00 306.00,70.00" fill="#923d39" />
  <rect x="322" y="36" width="200" height="57" rx="6" fill="#f3e6e1" stroke="none" stroke-width="1.5" />
  <text x="422" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#923d39" font-weight="650">Black mates White</text>
  <rect x="18" y="136" width="244" height="89" rx="8" fill="white" stroke="#d6cfc6" stroke-width="1.5" />
  <text x="140" y="171" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" text-anchor="middle" fill="#252320" font-weight="650">Black flips a bit</text>
  <text x="140" y="199" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#57534e" font-weight="400">B-LOSE is true</text>
  <line x1="269" y1="181" x2="309.0" y2="181.0" stroke="#245675" stroke-width="3" />
  <polygon points="316,181 306.00,176.00 306.00,186.00" fill="#245675" />
  <rect x="322" y="152" width="200" height="57" rx="6" fill="#e5edf0" stroke="none" stroke-width="1.5" />
  <text x="422" y="188" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#245675" font-weight="650">White mates Black</text>
</svg>
